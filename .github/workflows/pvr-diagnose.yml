name: PVR INOX diagnose

# Read-only, manual-only: does PVR INOX's API answer a GitHub Actions runner,
# and does Hyderabad look the way platforms/pvr_inox.py expects? PVR INOX
# stays disabled in TicketRadar until this has been run and its result
# reviewed.
#
# At most four paced requests (city, cinemas, now showing, one cinema's shows
# today). The first 401/403/429 ends the run — nothing is retried and no
# workaround is attempted. No secrets, no Firestore, no monitors, no email,
# no seat layout, no booking. The last log line is the verdict:
#   PVR_DIAGNOSTIC_OK · _BLOCKED_403 · _RATE_LIMITED_429 · _API_ERROR · _MALFORMED_RESPONSE

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pvr-diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Diagnose
        env:
          TZ: Asia/Kolkata
          PYTHONUNBUFFERED: "1"
        run: python tools/pvr_diagnose.py --city hyderabad
