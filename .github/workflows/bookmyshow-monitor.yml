name: BookMyShow monitor

# One monitoring pass per run
# ---------------------------
# Every run checks the monitors that are due exactly once (one shared listing
# read per film and date serves every target), writes the results to
# Firestore, sends any alert, and exits. There is no loop, no 30-second
# polling, no self-dispatch and no repository write.
#
# GitHub does not guarantee this schedule. Scheduled runs can start late or be
# dropped under load, and this repository has measured both (see
# docs/audit-reports/2026-11-26-doomsday-two-target-single-pass.md). A late
# run simply checks then; nothing is replayed.
#
# The concurrency group allows one run at a time. A run that arrives while
# another is in progress waits; a newer waiting run replaces an older waiting
# one. Missed runs therefore never pile up into a burst, and two passes never
# overlap.

on:
  schedule:
    - cron: "*/5 * * * *"
  # The app's "Check now" / first check: same inputs as before.
  workflow_dispatch:
    inputs:
      force:
        description: "Check now, ignoring each monitor's interval"
        type: boolean
        default: true
      dry_run:
        description: "Evaluate but send no email and write nothing"
        type: boolean
        default: false
      monitor_id:
        description: "Check only this monitor (optional)"
        type: string
        default: ""

concurrency:
  group: bookmyshow-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    # The worker credential and Gmail sender live in the `production`
    # environment (deployment branch: main only).
    environment: production
    runs-on: ubuntu-latest
    # A pass is measured in seconds; worst case (every read timing out once and
    # being retried once) stays under this hard stop, inside the 5-minute cadence.
    timeout-minutes: 4

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install --require-hashes -r ci/requirements-worker.lock

      - name: One monitoring pass
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TZ: Asia/Kolkata
          PYTHONUNBUFFERED: "1"
          # The city-listing throttle survives between runs in Firestore.
          RADAR_DISCOVERY_CLOCK: firestore
          # No browser imitation: a plain client that says it is an automated
          # tool. A refusal (401/403/429) is final and is recorded as a failed
          # check; a request that did not complete is retried once (10 s each).
          RADAR_CLIENT: honest
          RADAR_RETRY_REFUSALS: "0"
          RADAR_HTTP_ATTEMPTS: "1"
          DISPATCHED: ${{ github.event_name == 'workflow_dispatch' }}
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_MONITOR_ID: ${{ inputs.monitor_id }}
        run: |
          args=()
          if [ "$DISPATCHED" = "true" ]; then
            [ "$INPUT_FORCE" = "true" ] && args+=(--force)
            [ "$INPUT_DRY_RUN" = "true" ] && args+=(--dry-run)
            [ -n "$INPUT_MONITOR_ID" ] && args+=(--monitor "$INPUT_MONITOR_ID")
          fi
          python run_monitor.py "${args[@]}"
