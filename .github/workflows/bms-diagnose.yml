name: BookMyShow diagnose

# Diagnostics only: reports what BookMyShow answers from a runner and changes
# nothing. Used to establish, from evidence, which client and endpoint the
# catalogue sync should use.

on:
  workflow_dispatch:
    inputs:
      city:
        description: "City slug"
        type: string
        default: "hyderabad"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests "curl_cffi>=0.7"
      - run: python tools/bms_diagnose.py --city "${{ inputs.city }}"
