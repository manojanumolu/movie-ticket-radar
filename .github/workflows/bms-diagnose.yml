name: BookMyShow diagnose

# Diagnostics only: reports what BookMyShow answers from a runner and changes
# nothing. Used to establish, from evidence, which client and endpoint the
# catalogue sync should use.

on:
  workflow_dispatch:
    inputs:
      city:
        description: "City slug"
        type: string
        default: "hyderabad"
      group:
        description: "Movie title to dump child events + per-child venues for (optional)"
        type: string
        default: ""
      venue_url:
        description: "EVENT:VENUE:slug:date — probe theatre-page URL shapes (optional)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Diagnose
        # Inputs reach the shell as environment variables, never as text
        # spliced into the command: a value containing quotes or `$(...)`
        # is data to the script, not syntax to the shell.
        env:
          INPUT_CITY: ${{ inputs.city }}
          INPUT_GROUP: ${{ inputs.group }}
          INPUT_VENUE_URL: ${{ inputs.venue_url }}
        run: python tools/bms_diagnose.py --city "$INPUT_CITY" --group "$INPUT_GROUP" --venue-url "$INPUT_VENUE_URL"
