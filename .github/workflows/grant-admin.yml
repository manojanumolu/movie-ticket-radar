name: Grant admin claim

# Sets, shows or removes the `admin: true` custom claim on ONE Firebase
# account — the claim that lifts TicketRadar's active-monitor limit for the
# owner. Custom claims can only be written with the project's service
# account, which lives in this repository's secrets and nowhere a browser
# can reach; this is the one place that credential is used for anything but
# the worker. Nothing here touches Firestore, rules, or any other account.
#
# Run it from the Actions tab: Grant admin claim → Run workflow → your
# sign-in email, action "grant". This repository and its logs are public,
# so the log shows a masked address and whether the claim is set — never
# the full address, the UID, a key or a token.

on:
  workflow_dispatch:
    inputs:
      email:
        description: "The account's sign-in email address"
        type: string
        required: true
      action:
        description: "show: print current claims · grant: set admin true · revoke: remove it"
        type: choice
        options: [show, grant, revoke]
        default: show

permissions:
  contents: read

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install requests google-auth
      - name: Manage admin claim
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          INPUT_EMAIL: ${{ inputs.email }}
          INPUT_ACTION: ${{ inputs.action }}
        run: |
          args=()
          [ "$INPUT_ACTION" = "grant" ] && args+=(--grant)
          [ "$INPUT_ACTION" = "revoke" ] && args+=(--revoke)
          python tools/grant_admin.py --email "$INPUT_EMAIL" "${args[@]}"
