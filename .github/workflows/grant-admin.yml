name: Grant admin claim

# Sets, shows or removes the `admin: true` custom claim on ONE Firebase
# account — the claim that lifts TicketRadar's active-monitor limit for the
# owner. Custom claims can only be written with the project's service
# account, which lives in this repository's secrets and nowhere a browser
# can reach; this is the one place that credential is used for anything but
# the worker. Nothing here touches Firestore, rules, or any other account.
#
# Run it from the Actions tab: Grant admin claim → Run workflow → the
# account's Firebase UID (Firebase console → Authentication → User UID; an
# email address also works), action "grant".
#
# This repository and its logs are public, and GitHub prints a step's `env:`
# block and command line in the log. So the account is NOT passed either way:
# tools/grant_admin.py reads it from the event payload file, masks it with
# ::add-mask::, and prints only a masked address and UID prefix and whether
# the claim is set. Never the full address, the UID, a key or a token.

on:
  workflow_dispatch:
    inputs:
      account:
        description: "The account's Firebase UID (preferred) or sign-in email — never printed"
        type: string
        required: true
      action:
        description: "show: print current claims · grant: set admin true · revoke: remove it"
        type: choice
        options: [show, grant, revoke]
        default: show

permissions:
  contents: read

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install requests google-auth
      - name: Manage admin claim
        # The account input is deliberately absent from env: and from the
        # command line (both are printed in this public log): the script reads
        # it from $GITHUB_EVENT_PATH and masks it before printing anything.
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          INPUT_ACTION: ${{ inputs.action }}
        run: |
          args=()
          [ "$INPUT_ACTION" = "grant" ] && args+=(--grant)
          [ "$INPUT_ACTION" = "revoke" ] && args+=(--revoke)
          python tools/grant_admin.py --from-event "${args[@]}"
