name: Dedicated monitor worker relay

on:
  workflow_call:
    inputs:
      monitor_id:
        type: string
        required: true
      force:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  invoke:
    if: ${{ github.repository == 'manojanumolu/movie-ticket-radar' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && vars.RADAR_ENABLE_MONITOR_RELAY == 'true' }}
    permissions:
      contents: read
      id-token: write
    environment: monitor-dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: dedicated-monitor-worker-relay
      cancel-in-progress: false
    steps:
      - name: Validate the intended target
        env:
          MONITOR_ID: ${{ inputs.monitor_id }}
          SERVICE_URL: ${{ vars.RADAR_WORKER_SERVICE_URL }}
        shell: bash
        run: |
          [[ "$MONITOR_ID" =~ ^[A-Za-z0-9_-]{1,128}$ ]]
          [[ "$SERVICE_URL" =~ ^https://[a-z0-9-]+[.]run[.]app$ ]]
      - name: Exchange the workflow identity for a worker invoker token
        id: worker-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.RADAR_RELAY_WIF_PROVIDER }}
          service_account: ${{ vars.RADAR_RELAY_INVOKER }}
          token_format: id_token
          id_token_audience: ${{ vars.RADAR_WORKER_SERVICE_URL }}
          create_credentials_file: false
          export_environment_variables: false
      - name: Queue the selected monitor check
        env:
          MONITOR_ID: ${{ inputs.monitor_id }}
          FORCE: ${{ inputs.force }}
          REQUEST_ID: ${{ github.run_id }}
          SERVICE_URL: ${{ vars.RADAR_WORKER_SERVICE_URL }}
          INVOKER_TOKEN: ${{ steps.worker-auth.outputs.id_token }}
        shell: bash
        run: |
          body=$(jq -cn --arg id "$MONITOR_ID" --argjson force "$FORCE" --arg request "$REQUEST_ID" \
            '{monitor_id:$id,force:$force,request_id:$request}')
          curl --fail --silent --show-error --output /dev/null --max-time 55 \
            --header "Authorization: Bearer $INVOKER_TOKEN" \
            --header "Content-Type: application/json" --data-binary "$body" "${SERVICE_URL}/check"
