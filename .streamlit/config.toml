# TicketRadar — dark cinematic shell.
# Palette mirrors ticketradar-ui-design-system-2/project/DESIGN-SPEC.md §2.

[theme]
base = "dark"
primaryColor = "#FF3355"
backgroundColor = "#08080A"
secondaryBackgroundColor = "#101014"
textColor = "#F2F2F4"
font = "Manrope, sans-serif"
codeFont = "DM Mono, monospace"

[server]
headless = true

[client]
# The app is public. An uncaught exception shows a viewer only its type and
# a generic line; the message and traceback go to the console log, which
# only the owner can read. TicketRadar's own error lines (st.error, the
# flash) are rendered by the app and are unaffected.
showErrorDetails = "type"

[browser]
gatherUsageStats = false
