# TicketRadar — dark cinematic shell.
# Palette mirrors ticketradar-ui-design-system-2/project/DESIGN-SPEC.md §2.

[theme]
base = "dark"
primaryColor = "#FF3355"
backgroundColor = "#08080A"
secondaryBackgroundColor = "#101014"
textColor = "#F2F2F4"
font = "Manrope, sans-serif"
codeFont = "DM Mono, monospace"

[server]
headless = true

[browser]
gatherUsageStats = false
